---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: rays.components.platform.opendatahub.io
  labels:
    {{- include "kuberay-odh-operator.labels" . | nindent 4 }}
spec:
  group: components.platform.opendatahub.io
  names:
    kind: Ray
    listKind: RayList
    plural: rays
    singular: ray
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - description: Ready
          jsonPath: .status.conditions[?(@.type=="Ready")].status
          name: Ready
          type: string
        - description: Reason
          jsonPath: .status.conditions[?(@.type=="Ready")].reason
          name: Reason
          type: string
        - description: Phase
          jsonPath: .status.phase
          name: Phase
          type: string
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          description: Ray is the module CR reconciled by the KubeRay module operator.
          type: object
          x-kubernetes-validations:
            - message: Ray name must be default-ray
              rule: self.metadata.name == 'default-ray'
          properties:
            apiVersion:
              description: >-
                APIVersion defines the versioned schema of this representation of an object.
              type: string
            kind:
              description: >-
                Kind is a string value representing the REST resource this object represents.
              type: string
            metadata:
              type: object
            spec:
              description: RaySpec defines the desired state of the Ray module.
              type: object
              properties:
                managementState:
                  description: >-
                    ManagementState controls whether the operator actively manages the
                    module (Managed) or removes it (Removed).
                  type: string
                  enum:
                    - Managed
                    - Removed
                  default: Managed
            status:
              description: RayStatus defines the observed state of the Ray module.
              type: object
              properties:
                phase:
                  description: Phase is the top-level lifecycle phase of the module.
                  type: string
                observedGeneration:
                  description: The generation observed by the resource controller.
                  type: integer
                  format: int64
                conditions:
                  type: array
                  x-kubernetes-list-type: atomic
                  items:
                    type: object
                    required:
                      - status
                      - type
                    properties:
                      lastTransitionTime:
                        description: >-
                          lastTransitionTime is the last time the condition transitioned
                          from one status to another.
                        type: string
                        format: date-time
                      lastHeartbeatTime:
                        description: >-
                          The last time we got an update on a given condition, present
                          only for backward compatibility reasons.
                        type: string
                        format: date-time
                      message:
                        description: >-
                          message is a human-readable message indicating details about
                          the transition.
                        type: string
                      observedGeneration:
                        description: >-
                          observedGeneration represents the .metadata.generation that the
                          condition was set based upon.
                        type: integer
                        format: int64
                        minimum: 0
                      reason:
                        description: >-
                          reason contains a programmatic identifier indicating the reason
                          for the condition's last transition.
                        type: string
                      severity:
                        description: >-
                          Severity with which to treat failures of this type of condition.
                          When this is not specified, it defaults to Error.
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      type:
                        description: type of condition in CamelCase.
                        type: string
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                releases:
                  description: Releases lists the deployed component versions.
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - name
                  items:
                    description: ComponentRelease represents a component release.
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        type: string
                      version:
                        type: string
                      repoUrl:
                        type: string
