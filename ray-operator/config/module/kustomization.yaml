apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Resources rendered and applied by the KubeRay module operator at runtime.
# This overlay is embedded into the operator binary; changes here require a rebuild.
resources:
  - ../crd/bases/ray.io_rayclusters.yaml
  - ../crd/bases/ray.io_rayjobs.yaml
  - ../crd/bases/ray.io_rayservices.yaml
  - scc.yaml
  - webhook-service.yaml
  - webhook-config.yaml
